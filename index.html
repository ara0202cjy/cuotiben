<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7faf8" />
  <title>错题本 · 中学错题收集工作台</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260909d" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 拼音库（联网加载，用于语文字词默写自动注音；离线时自动降级为手动输入） -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.25.0/dist/index.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="topbarTitle">错题本</h1>
        <button class="icon-btn" id="topbarSettings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        </button>
      </div>
    </header>

    <!-- 主内容区（各视图在此渲染） -->
    <main id="view" class="view"></main>

    <!-- 底部标签导航（单色图标） -->
    <nav class="tabbar">
      <button class="tab" data-view="home" data-label="错题本">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c0-1.1 1-2 2-2h6v17H6a2 2 0 0 1-2-2V5z"/><path d="M21 5c0-1.1-1-2-2-2h-6v17h6a2 2 0 0 0 2-2V5z"/></svg></span><span class="tab-tx">错题本</span>
      </button>
      <button class="tab" data-view="list" data-label="笔记本">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg></span><span class="tab-tx">笔记本</span>
      </button>
      <button class="tab fab" id="fabAdd" data-label="录入错题" title="录入错题">＋</button>
      <button class="tab" data-view="review" data-label="复习">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3.5V9h-5.5"/></svg></span><span class="tab-tx">复习</span>
        <span class="tab-badge" id="reviewBadge" hidden>0</span>
      </button>
      <button class="tab" data-view="mine" data-label="我的">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg></span><span class="tab-tx">我的</span>
      </button>
    </nav>
  </div>

  <!-- 通用弹层容器 -->
  <div id="sheet" class="sheet-mask" hidden>
    <div class="sheet" id="sheetBody"></div>
  </div>

  <!-- 图片裁剪独立弹层（叠在录入页之上，裁剪后回到录入页继续） -->
  <div id="cropper" class="crop-mask" hidden>
    <div class="crop-panel" id="cropPanel"></div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 导出 PDF 专用打印区（屏幕隐藏，打印时显示） -->
  <div id="printArea"></div>

  <script src="assets/js/data.js?v=20260909d"></script>
  <script src="assets/js/app.js?v=20260909d"></script>
</body>
</html>
